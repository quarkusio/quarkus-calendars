title: Quarkus Insights Episode 265 - Observability & evaluation with Langfuse
description: |
  AI-infused applications demand a rethinking of our testing practices. Developers face a new class of challenge as LLMs become standard integration points in modern applications: non-deterministic behavior, complex evaluation criteria, and the need for robust testing strategies.

  Join Eric as he talks about testing strategies and evaluations in Quarkus and LangChain4j, as well as integrations with other open source tools.

